[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omegaclaw-launchpad"
version = "0.2.0"
description = "A governed onboarding lab for a first instrumented OmegaClaw reflection."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "OmegaClaw Launchpad contributors"}]
dependencies = []

[project.scripts]
omega-launchpad = "launchpad.cli:main"
omega-launchpad-mcp = "launchpad.studio.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
